# Netlify configuration for ClientHub (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) routing fallback
# Ensures direct navigation to /login, /dashboard, etc. or page refreshes don't 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
